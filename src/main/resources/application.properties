spring.application.name=transport-service-issue-tracker

# Local H2 development database
spring.datasource.url=jdbc:h2:mem:transport_tracker;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Development errors
server.error.include-message=always
server.error.include-binding-errors=always

# JWT authentication
security.jwt.secret=${JWT_SECRET:dHJhbnNwb3J0LXNlcnZpY2UtaXNzdWUtdHJhY2tlci1rZXktMjAyNg==}
security.jwt.expiration-ms=86400000

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.attachments-dir=${ATTACHMENTS_DIR:uploads/attachments}